<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-PD3CJ9S3"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="판다마켓 로고" />
          </a>
        </div>
        <nav class="nav">
          <a href="/login" class="login-btn">로그인</a>
        </nav>
      </div>
    </header>
    <main class="main">
      <section class="hero-section">
        <div class="container">
          <div class="hero-info">
            <h1 class="hero-slogun">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a href="/items" class="hero-watch-btn">구경하러 가기</a>
          </div>
          <div class="hero-image">
            <img src="/images/Img_home_top.png" alt="판다마켓 히어로" />
          </div>
        </div>
      </section>
      <section class="card-section">
        <div class="container">
          <div class="card-wrap">
            <div class="card">
              <div class="card-image-wrap">
                <img src="images/landing/hot_item.png" alt="Hot Item 이미지" />
              </div>
              <div class="card-message-wrap">
                <span class="badge">Hot Item</span>
                <h1 class="message-head">
                  인기 상품을<br />
                  확인해 보세요
                </h1>
                <p class="message-specific">
                  가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
          </div>
          <div class="card-wrap">
            <div class="card reverse">
              <div class="card-image-wrap">
                <img
                  src="images/landing/search_item.png"
                  alt="Search Item 이미지"
                />
              </div>
              <div class="card-message-wrap">
                <span class="badge">Search</span>
                <h1 class="message-head">
                  구매를 원하는<br />
                  상품을 검색하세요
                </h1>
                <p class="message-specific">
                  구매하고 싶은 물품은 검색해서<br />
                  쉽게 찾아보세요
                </p>
              </div>
            </div>
          </div>
          <div class="card-wrap">
            <div class="card">
              <div class="card-image-wrap">
                <img
                  src="images/landing/register_item.png"
                  alt="Register 이미지"
                />
              </div>
              <div class="card-message-wrap">
                <span class="badge">Register</span>
                <h1 class="message-head">
                  판매를 원하는<br />
                  상품을 등록하세요
                </h1>
                <p class="message-specific">
                  어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="bottom-section">
        <div class="container">
          <div class="bottom-message-wrap">
            <h1 class="bottom-message">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h1>
          </div>
          <div class="bottom-image-wrap">
            <img
              src="/images/Img_home_bottom.png"
              alt="하단 판다 이미지"
              class="bottom-image"
            />
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p class="copyright">&copy;codeit - 2024</p>
        <nav class="bottom-nav">
          <a href="/privacy" class="privacy-policy">Privacy Policy</a>
          <a href="/faq" class="faq">FAQ</a>
        </nav>
        <nav class="sns-nav">
          <a
            href="https://www.facebook.com"
            class="sns-facebook"
            target="_blank"
          >
            <img src="/images/sns_icons/ic_facebook.png" alt="facebook" />
          </a>
          <a href="https://www.x.com" class="sns-twitter" target="_blank">
            <img src="/images/sns_icons/ic_twitter.png" alt="twitter" />
          </a>
          <a href="https://www.youtube.com" class="sns-youtube" target="_blank">
            <img src="/images/sns_icons/ic_youtube.png" alt="youtube" />
          </a>
          <a
            href="https://www.instagram.com"
            class="sns-instagram"
            target="_blank"
          >
            <img src="/images/sns_icons/ic_instagram.png" alt="instagram" />
          </a>
        </nav>
      </div>
    </footer>
  </body>
</html>
