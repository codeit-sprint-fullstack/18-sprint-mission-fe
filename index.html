<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <!-- css -->
    <link rel="stylesheet" href="./reset.css" />

    <!-- 폰트 -->

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- st.css -->

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- 로고,로그인 바 -->

    <header class="container">
      <div class="header-inner">
        <h1>
          <a href="/">
            <img src="./img/Property 1=sm.png" alt="판다 마켓 로고" />
          </a>
        </h1>

        <a href="login.html" class="login">로그인</a>
      </div>
    </header>

    <!-- 시퀀스1 인기 상품 -->

    <main>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-inner">
            <p>
              일상의 모든 물건을 <br />
              거래 해보세요
            </p>
            <a href="./item.html" class="item">구경하러 가기</a>
          </div>
          <img src="./img/Img_home_top.png" alt="탑 이미지" />
        </div>
      </section>

      <!-- 시퀀스2 -->
      <section class="features">
        <div class="background-1">
          <img src="./img/Img_home_01.png" alt="메인 이미지" />

          <div class="hot-description">
            <p class="best">Hot item</p>
            <h2>
              인기 상품을 <br />
              확인해 보세요
            </h2>

            <p class="description">
              가장 HOT한 중고거래 물품을 <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <!-- 시퀀스3 -->

      <section class="search-section">
        <div class="search-inner">
          <div class="item-buy">
            <p class="search">search</p>
            <h3>
              구매를 원하는 <br />
              상품을 검색하세요
            </h3>
            <p class="search2">
              구매하고 싶은 물품은 검색해서 <br />
              쉽게 찾아보세요
            </p>
          </div>

          <img src="./img/Img_home_02.png" alt="돋보기" />
        </div>
      </section>

      <!-- 시퀀스4 -->

      <section class="item-sell">
        <div class="sell-inner">
          <img src="./img/Img_home_03.png" alt="판매 등록" />
          <div class="sell-register">
            <p class="register">Register</p>

            <h4>
              판매를 원하는 <br />
              상품을 등록하세요
            </h4>

            <p class="register2">
              어떤 물건이든 판매하고 싶은 상품을 <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <!-- 시퀀스5 -->

      <section class="hero2">
        <div class="hero2-inner">
          <p>
            믿을 수 있는 <br />
            판다마켓 중고 거래
          </p>
        </div>
        <img src="./img/Img_home_bottom.png" alt="바텀 이미지" />
      </section>

      <!-- 시퀀스6 footer -->

      <section class="footer">
        <div class="footer-inner">
          <p class="codeit">@codeit - 2024</p>
          <div class="faq">
            <a href="./privacry.html" class="privacry">Privacy Policy </a>
            <a href="./faq.html" class="faq">FAQ</a>
          </div>
        </div>
        <div class="icon">
          <a href="https://www.facebook.com" target="_blank"
            ><img src="./img/ic_facebook.png" alt="facebook"
          /></a>
          <a href="https://x.com" target="_blank"
            ><img src="./img/ic_twitter.png" alt="twitter"
          /></a>
          <a href="https://www.youtube.com" target="_blank"
            ><img src="./img/ic_youtube.png" alt="youtube"
          /></a>
          <a href="https://www.instagram.com" target="blank"
            ><img src="./img/ic_instagram.png" alt="instagram"
          /></a>
        </div>
      </section>
