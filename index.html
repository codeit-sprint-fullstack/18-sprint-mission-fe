<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/font.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <div class="wrap">
      <header class="header-m">
        <nav>
          <div class="logo">
            <a href="index.html"
              ><img src="./image/logo.svg" alt="판다마켓"
            /></a>
          </div>
          <a class="login-m" href="./html/login.html">로그인</a>
        </nav>
      </header>
      <main>
        <section class="visual hero">
          <div class="text-box">
            <span
              >일상의 모든 물건을<br />
              거래해 보세요</span
            >
            <a href="./html/items.html">구경하러 가기</a>
          </div>
          <div class="img-box">
            <img src="./image/home_top.png" alt="hero-main" />
          </div>
        </section>
        <section class="item hot">
          <div class="item-inner">
            <div class="img-box">
              <img src="image/item-1.png" alt="image" />
            </div>
            <div class="text-box">
              <div class="badge">Hot item</div>
              <p>
                인기 상품을<br />
                확인해 보세요
              </p>
              <span
                >가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요</span
              >
            </div>
          </div>
        </section>
        <section class="item search">
          <div class="item-inner">
            <div class="img-box">
              <img src="image/item-2.png" alt="image" />
            </div>
            <div class="text-box">
              <div class="badge">Search</div>
              <p>구매를 원하는<br />상품을 검색하세요</p>
              <span
                >구매하고 싶은 물품은 검색해서<br />
                쉽게 찾아보세요</span
              >
            </div>
          </div>
        </section>
        <section class="item register">
          <div class="item-inner">
            <div class="img-box">
              <img src="image/item-3.png" alt="image" />
            </div>
            <div class="text-box">
              <div class="badge">Register</div>
              <p>
                판매를 원하는<br />
                상품을 등록하세요
              </p>
              <span>
                어떤 물건이든 판매하고 싶은 상품을<br />
                쉽게 등록하세요</span
              >
            </div>
          </div>
        </section>
        <section class="visual bottom">
          <div class="text-box">
            <span
              >믿을 수 있는<br />
              판다마켓 중고 거래</span
            >
          </div>
          <div class="img-box">
            <img src="./image/home_bottom.png" alt="hero-bottom" />
          </div>
        </section>
      </main>
      <footer>
        <div class="f-inner">
          <span>©codeit - 2026</span>
          <div class="center">
            <span><a href="./html/privacy.html">Privacy Policy</a></span>
            <span><a href="./html/faq.html">FAQ</a></span>
          </div>
          <div class="sns">
            <a href="#" target="_blank"
              ><img src="./image/f-facebook.png" alt="sns"
            /></a>
            <a href="#" target="_blank"
              ><img src="./image/f-twtter.png" alt="sns"
            /></a>
            <a href="#" target="_blank"
              ><img src="./image/f-youtube.png" alt="sns"
            /></a>
            <a href="#" target="_blank"
              ><img src="./image/f-insta.png" alt="sns"
            /></a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
