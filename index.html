<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="gnb">
          <a href="/">
            <img class="gnb-logo" src="./assets/logo.png" alt="판다마켓 로고" />
          </a>
          <a class="button login-button" href="./login.html">로그인</a>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="content-container hero-content-container">
            <div class="title-container hero-title-container">
              <h1 class="main-title">
                일상의 모든 물건을<br />
                거래해보세요
              </h1>
              <a class="button shortcut-button" href="./items.html">
                구경하러 가기
              </a>
            </div>
            <img
              class="hero-img"
              src="./images/Img_home_top.png"
              alt="판다마켓 대표 이미지"
            />
          </div>
        </div>
      </section>
      <section>
        <div class="container feature-container">
          <div class="content-container feature-content-container">
            <img
              class="content-img"
              src="./images/Img_home_01.png"
              alt="인기상품 확인"
            />
            <div class="feature-content">
              <div class="eyebrow">Hot item</div>
              <div class="feature-text">
                <h2 class="title">
                  인기 상품을<br />
                  확인해 보세요
                </h2>
                <p class="description">
                  가장 HOT한 중고거래 물품을<br />
                  판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section>
        <div class="container feature-container">
          <div class="content-container feature-content-container">
            <div class="feature-content right">
              <div class="eyebrow">Search</div>
              <div class="feature-text">
                <h2 class="title">
                  구매를 원하는<br />
                  상품을 검색하세요
                </h2>
                <p class="description">
                  구매하고 싶은 물품은 검색해서<br />
                  쉽게 찾아보세요
                </p>
              </div>
            </div>
            <img
              class="content-img"
              src="./images/Img_home_02.png"
              alt="상품 검색"
            />
          </div>
        </div>
      </section>
      <section>
        <div class="container feature-container">
          <div class="content-container feature-content-container">
            <img
              class="content-img"
              src="./images/Img_home_03.png"
              alt="상품 등록"
            />
            <div class="feature-content">
              <div class="eyebrow">Register</div>
              <div class="feature-text">
                <h2 class="title">
                  판매를 원하는<br />
                  상품을 등록하세요
                </h2>
                <p class="description">
                  어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="banner">
        <div class="container">
          <div class="content-container banner-content-container">
            <div class="title-container">
              <h1 class="main-title">
                믿을 수 있는<br />
                판다마켓 중고 거래
              </h1>
            </div>
            <img
              class="banner-img"
              src="./images/Img_home_bottom.png"
              alt="판다마켓 배너 이미지"
            />
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <div class="footer-content-container">
          <div class="footer-text">@codeit - 2024</div>
          <nav>
            <a href="./privacy.html">Privacy Policy</a>
            <a href="./faq.html">FAQ</a>
          </nav>
          <div class="sns-container">
            <a href="https://www.facebook.com/" target="_blank">
              <img src="./assets/ic_facebook.png" alt="페이스북" />
            </a>
            <a href="https://x.com/" target="_blank">
              <img src="./assets/ic_twitter.png" alt="X" />
            </a>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="./assets/ic_youtube.png" alt="유튜브" />
            </a>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="./assets/ic_instagram.png" alt="인스타그램" />
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
