<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZMYKHP6EME"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZMYKHP6EME");
    </script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/palette.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="inner">
        <a href="/" class="logo">
          <img src="images/logo.png" alt="판다마켓" />
        </a>
        <a href="/login" class="btn btn-login">로그인</a>
      </div>
    </header>

    <main>
      <!-- 히어로: 하늘색 배경 -->
      <section class="hero">
        <div class="inner">
          <div class="hero-text">
            <h1>일상의 모든 물건을<br />거래해 보세요</h1>
            <a href="/items" class="btn btn-items">구경하러 가기</a>
          </div>
          <img src="images/hero.png" alt="" class="hero-img" />
        </div>
      </section>

      <!-- 기능 소개 3개 -->
      <section class="feature">
        <div class="feature-card">
          <img src="images/feature1.png" alt="" class="feature-img" />
          <div class="feature-text">
            <p class="feature-label">Hot item</p>
            <h2>인기 상품을<br />확인해 보세요</h2>
            <p class="feature-desc">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature feature-reverse">
        <div class="feature-card">
          <img src="images/feature2.png" alt="" class="feature-img" />
          <div class="feature-text">
            <p class="feature-label">Search</p>
            <h2>구매를 원하는<br />상품을 검색하세요</h2>
            <p class="feature-desc">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature">
        <div class="feature-card">
          <img src="images/feature3.png" alt="" class="feature-img" />
          <div class="feature-text">
            <p class="feature-label">Register</p>
            <h2>판매를 원하는<br />상품을 등록하세요</h2>
            <p class="feature-desc">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <!-- 하단 배너: 하늘색 배경 -->
      <section class="banner">
        <div class="inner">
          <div class="banner-text">
            <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <img src="images/banner.png" alt="" class="banner-img" />
        </div>
      </section>
    </main>

    <!-- 푸터: 3덩어리 -->
    <footer>
      <div class="inner">
        <p class="copyright">©codeit - 2024</p>

        <nav class="footer-links">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </nav>

        <div class="sns">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic_facebook.png" alt="페이스북" />
          </a>
          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic_twitter.png" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic_youtube.png" alt="유튜브" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
