      <nav class="nav-var">

              일상의 모든 물건을<br />거래해 보세요

        </div>
      </section>
      <section class="container">
        <div class="main-content">
          <img src="./image/Img_home_01.png" />
          <div class="info-container">
            <div class="info">
              <p class="badge">Hot item</p>
              <h2 class="sub-title">인기 상품을<br />확인해 보세요</h2>
              <p class="description">
                가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="container">
        <div class="main-content">
          <div class="info-container text-right">

        </div>
      </section>
      <section class="container">
        <div class="main-content">
          <img src="./image/Img_home_03.png" />
          <div class="info-container">
            <div class="info">
              <p class="badge">Register</p>
              <h2 class="sub-title">판매를 원하는<br />상품을 등록하세요</h2>
              <p class="description">
                어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="bottom-container">
        <div class="bottom-content">
          <div class="bottom-description">
            <h2 class="sub-title">믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <img src="./image/Img_home_bottom.png" class="landing-img" />
