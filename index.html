  <body>
    <header class="header">
      <nav class="gnb">
        <a href="/" class="logo">
          <img src="img/img_logo.png" class="logo-img" alt="판다마켓 로고" />
          <img
            src="img/img_title.png"
            alt="판다마켓 타이틀"

    <main>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-text-container">
            <span class="hero-text"
              >일상의 모든 물건을<br />
              거래해 보세요</span
            >
            <a href="/items.html" class="hero-btn">구경하러 가기</a>
          </div>
          <img
            src="img/Img_home_top.png"
            class="hero-img"
            alt="히어로 이미지"
          />
        </div>
      </section>
      <section class="feature">
        <div class="feature-container">
          <img
            src="img/Img_home_01.png"
            class="feature-img"
            alt="인기 상품 이미지"
          />
          <div class="feature-content">
            <span class="feature-title">Hot item</span>
            <div class="feature-text-container">
              <span class="feature-text">인기 상품을<br />확인해 보세요</span>

              >
            </div>
          </div>
        </div>
      </section>
      <section class="feature">
        <div class="feature-container">
          <div class="feature-content feature-text-content--right">
            <span class="feature-title">Search</span>
            <div class="feature-text-container">
              <span class="feature-text"
                >구매를 원하는<br />상품을 검색하세요</span
              >
              <span class="feature-small-text"
                >구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</span
              >
            </div>
          </div>
          <img
            src="img/Img_home_02.png"
            class="feature-img"
            alt="검색 상품 이미지"
          />
        </div>
      </section>
      <section class="feature">
        <div class="feature-container">
          <img
            src="img/Img_home_03.png"
            class="feature-img"
            alt="등록 상품 이미지"
          />
          <div class="feature-content">
            <div class="feature-text-container">
              <span class="feature-title">Register</span>
              <span class="feature-text"
                >판매를 원하는 <br />상품을 등록하세요</span
              >
            </div>
            <span class="feature-small-text"
              >어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요</span
            >
          </div>
        </div>

      <section class="last-banner">
        <div class="last-banner-container">
          <p class="last-banner-text">믿을 수 있는<br />판다마켓 중고 거래</p>

            src="img/Img_home_bottom.png"
            class="last-banner-img"
            alt="하단배너 이미지"
          />
        </div>
