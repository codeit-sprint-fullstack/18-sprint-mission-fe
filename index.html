<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <!-- 상단 네비바 -->
        <a href="/">
          <img class="nav-logo" src="./images/logo.png" alt="판다마켓 로고" />
        </a>
        <a href="/login" class="login-button">로그인</a>
      </nav>
    </header>

    <main>
      <!-- 홈 배너 -->
      <section class="banner-section home-section">
        <div class="banner-container home-container">
          <div class="home-content">
            <h1 class="banner-title home-title">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a href="/items" class="home-button">구경하러 가기</a>
          </div>

          <img
            class="banner-image home-image"
            src="./images/Img_home_top.png"
            alt="판다마켓 소개 이미지"
          />
        </div>
      </section>

      <!-- 인기상품 소개 섹션 -->
      <section class="info-section feature-section">
        <img
          src="./images/Img_home_01.png"
          alt="인기 상품 소개 이미지"
          class="info-image feature-image"
        />

        <div class="info-content feature-content">
          <span class="info-label feature-label"> Hot item </span>
          <h2 class="info-title feature-title">
            인기 상품을<br />
            확인해 보세요
          </h2>

          <p class="info-description feature-description">
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </section>

      <!-- 검색 섹션 -->
      <section class="info-section search-section">
        <div class="info-content search-content">
          <span class="info-label search-label"> Search </span>
          <h2 class="info-title search-title">
            구매를 원하는<br />
            상품을 검색하세요
          </h2>

          <p class="info-description search-description">
            구매하고 싶은 물품은 검색해서<br />
            쉽게 찾아보세요
          </p>
        </div>

        <img
          src="./images/Img_home_02.png"
          alt="상품 검색 기능 소개 이미지"
          class="info-image search-image"
        />
      </section>

      <!-- 레지스터 섹션 -->
      <section class="info-section register-section">
        <img
          src="./images/Img_home_03.png"
          alt="상품 등록 기능 소개 이미지"
          class="info-image register-image"
        />

        <div class="info-content register-content">
          <span class="info-label register-label">Register</span>

          <h2 class="info-title register-title">
            판매를 원하는<br />
            상품을 등록하세요
          </h2>

          <p class="info-description register-description">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </section>

      <!-- 하단 배너 -->
      <section class="banner-section bottom-section">
        <div class="banner-container bottom-container">
          <h2 class="banner-title bottom-title">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h2>

          <img
            src="./images/Img_home_bottom.png"
            alt="판다마켓 중고 거래 소개 이미지"
            class="banner-image bottom-image"
          />
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-container">
        <span class="footer-copyright"> ©codeit - 2024 </span>
        <div class="footer-links">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </div>
        <div class="footer-social">
          <a
            href="https://www.facebook.com/?locale=ko_KR"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./images/ic_facebook.png" alt="페이스북"
          /></a>
          <a
            href="https://x.com/home?lang=ko"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./images/ic_twitter.png" alt="x"
          /></a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./images/ic_youtube.png" alt="유튜브"
          /></a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./images/ic_instagram.png" alt="인스타그램"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
