<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P95WKKCR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
  </head>
  <body>
    <main class="auth-container">
      <header class="auth-header">
        <h1>
          <a href="/">
            <img src="../assets/images/logo.svg" alt="판다마켓" />
          </a>
        </h1>
      </header>
      <section class="auth-wrapper">
        <form class="auth-form">
          <div class="input-field">
            <label for="email" class="input-label">이메일</label>
            <input type="email" id="email" placeholder="이메일을 입력해주세요" class="input-text" />
          </div>
          <div class="input-field">
            <label for="password" class="input-label">비밀번호</label>
            <div class="input-password">
              <input type="password" id="password" placeholder="비밀번호를 입력해주세요" class="input-text" />
              <img class="btn-toggle-password" src="../assets/images/auth/btn_visibility_off_24px.svg" alt="비밀번호 보이기" />
              <img class="btn-toggle-password disabled" src="../assets/images/auth/btn_visibility_on_24px.svg" alt="비밀번호 보이기" />
            </div>
          </div>
          <button type="submit" class="btn-large disabled">로그인</button>
        </form>
        <div class="auth-social">
          <p>간편 로그인하기</p>
          <div class="auth-social-btn">
            <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer" class="google">
              <img src="../assets/images/auth/login_social_google.svg" alt="구글 로그인" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer" class="kakao">
              <img src="../assets/images/auth/login_social_kakao.svg" alt="카카오 로그인" />
            </a>
          </div>
        </div>
        <div class="auth-prompt">
          판다마켓이 처음이신가요?
          <a href="./signup.html">회원가입</a>
        </div>
      </section>
    </main>
  </body>
</html>
