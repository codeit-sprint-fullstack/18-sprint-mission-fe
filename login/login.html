<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <div class="container">
      <a href="../index.html" class="logo-link">
        <img src="../image/login_logo.png" alt="logo" />
      </a>
      <div class="login-form">
        <form action="/login" method="post">
          <div class="input-container">
            <p>이메일</p>
            <input
              type="text"
              class="input-field"
              name="username"
              placeholder="이메일을 입력해주세요"
              required
            />
          </div>
          <div class="input-container">
            <p>비밀번호</p>
            <input
              type="password"
              class="input-field"
              name="password"
              placeholder="비밀번호를 입력해주세요"
              required
            />
          </div>
          <button type="submit" class="login-button">로그인</button>
        </form>
        <div class="social-login">
          <div class="social-container">
            <p class="simple-login-text">간편 로그인하기</p>
            <div class="social-login-buttons">
              <a
                href="https://www.google.com/"
                class="social-button-google"
                aria-label="Google 간편 로그인"
              >
                <img src="../image/google-icon.png" alt="Google" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                class="social-button-kakao"
                aria-label="Kakao 간편 로그인"
              >
                <img src="../image/kakao-icon.png" alt="Kakao" />
              </a>
            </div>
          </div>
        </div>
        <p class="signup-guide">
          판다마켓이 처음이신가요?
          <a href="../signup/signup.html" class="signup-link">회원가입</a>
        </p>
      </div>
    </div>
  </body>
</html>
