<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <!-- 리셋css -->
    <link rel="stylesheet" href="./reset.css" />

    <!-- 폰트 -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- css -->
    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <main class="signup">
      <!-- 로고 -->
      <header>
        <a href="/">
          <img src="./img/Property 1=lg.png" alt="로고" />
        </a>
      </header>
      <!-- 로그인 -->
      <div class="signup-form">
        <h1>이메일</h1>
        <input type="email" placeholder="이메일을 입력해주세요" />
        <h1>닉네임</h1>
        <input type="text" placeholder="닉네임을 입력해주세요" />
      </div>
      <div class="password">
        <h1>비밀번호</h1>
        <div class="password-input">
          <input type="password" placeholder="비밀번호를 입력해주세요" />
          <img
            src="./img/btn_visibility_on_24px.png"
            alt="비밀번호표시 아이콘"
          />
        </div>
        <h1>비밀번호 확인</h1>
        <div class="password-input2">
          <input
            type="password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
          />
          <img
            src="./img/btn_visibility_on_24px.png"
            alt="비밀번호표시 아이콘"
          />
        </div>
      </div>

      <!-- 회원가입버튼 -->
      <button type="button" class="login-bar">회원가입</button>
      <!-- 간편로그인 -->
      <div class="social-login">
        <div class="social-inner">
          <p>간편 로그인하기</p>
          <div class="social-icon">
            <a href="http://www.google.com/"
              ><img src="./img/Component 2.png" alt="구글로그인"
            /></a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="./img/Component 3.png" alt="카카오톡로그인"
            /></a>
          </div>
        </div>
      </div>
      <!-- 회원가입 -->
      <div class="signup">
        <h2>
          이미 회원이신가요?
          <a href="./login.html">로그인</a>
        </h2>
      </div>
    </main>
  </body>
</html>
