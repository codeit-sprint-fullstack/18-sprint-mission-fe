<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag -->
    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-5WMJJT83"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 판다마켓</title>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <a href="/">
          <img class="title-logo-img" src="./assets/login-logo.png" />
        </a>
        <div class="content-container">
          <form class="auth-form" action="" method="POST">
            <div class="input-group">
              <label class="input-label" for="email">이메일</label>
              <input
                class="input-field"
                type="email"
                id="email"
                name="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <div class="input-group">
              <label class="input-label" for="nickname">닉네임</label>
              <input
                class="input-field"
                type="text"
                id="nickname"
                name="nickname"
                placeholder="닉네임을 입력해주세요"
              />
            </div>
            <div class="input-group">
              <label class="input-label" for="password">비밀번호</label>
              <div class="input-wrapper">
                <input
                  class="input-field password"
                  type="password"
                  id="password"
                  name="password"
                  placeholder="비밀번호를 입력해주세요"
                />
                <img
                  class="toggle-password-btn"
                  src="./assets/btn_visibility_on_24px.png"
                  alt="비밀번호 표시"
                />
              </div>
            </div>
            <div class="input-group">
              <label class="input-label" for="password-confirm">
                비밀번호 확인
              </label>
              <div class="input-wrapper">
                <input
                  class="input-field password"
                  type="password"
                  id="password-confirm"
                  name="passwordConfirm"
                  placeholder="비밀번호를 다시 한 번 입력해주세요"
                />
                <img
                  class="toggle-password-btn"
                  src="./assets/btn_visibility_on_24px.png"
                  alt="비밀번호 표시"
                />
              </div>
            </div>
            <button type="button" class="auth-button">회원가입</button>
          </form>
          <div class="sns-login">
            <div class="sns-login-title">간편 로그인하기</div>
            <div class="sns-login-buttons">
              <a href="https://www.google.com/" target="_blank">
                <img src="./assets/google-login-logo.png" alt="구글 로고" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img src="./assets/kakao-login-logo.png" alt="카카오 로고" />
              </a>
            </div>
          </div>
          <div class="auth-guide">
            <span>이미 회원이신가요?</span>
            <a class="auth-link" href="./login.html">로그인</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
