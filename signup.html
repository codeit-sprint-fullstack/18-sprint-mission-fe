<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pretendard 웹폰트 https://www.jsdelivr.com/Package/npm/pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 브라우저 기본 CSS 초기화 직접작성본 -->
    <link rel="stylesheet" href="reset.css" />
    <!-- 스타일시트 -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css" />
    <title>판다마켓 회원가입 페이지</title>
  </head>
  <body>
    <div class="login-container">
      <a href="/">
        <img
          class="login-logo"
          src="img/logo/panda_logo_sm_3x.png"
          alt="판다마켓 로고"
        />
      </a>

      <form class="login-form" action="/login" method="POST">
        <div class="form-group">
          <label for="user-email"> 이메일</label>
          <input
            type="email"
            id="user-email"
            name="user-email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>
        <div class="form-group">
          <label for="user-nickname"> 닉네임 </label>
          <input
            type="text"
            id="user-nickname"
            name="user-nickname"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="user-pw"> 비밀번호 </label>
          <div class="pw-field">
            <input
              type="password"
              id="user-pw"
              name="user-pw"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <img
              class="pw-icon"
              src="./img/icon/btn_invisible.png"
              alt="글자 안보임"
            />
          </div>
        </div>
        <div class="form-group">
          <label for="user-pw-re"> 비밀번호 확인 </label>
          <div class="pw-field">
            <input
              type="password"
              id="user-pw-re"
              name="user-pw"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
              required
            />
            <img
              class="pw-icon"
              src="./img/icon/btn_invisible.png"
              alt="글자 안보임"
            />
          </div>
        </div>
        <button class="login-button" type="submit">회원가입</button>

        <div class="social-login">
          <span>간편 로그인하기 </span>
          <div class="social-icons">
            <a href="https://www.google.com/"
              ><img src="/img/icon/google_3x.png" alt="구글 로그인" />
            </a>
            <a href="https://www.kakaocorp.com/page/"
              ><img src="/img/icon/kakaotalk_3x.png" alt="카카오톡 로그인"
            /></a>
          </div>
        </div>
        <div class="bottom-link">
          <p>이미 회원이신가요? <a href="login.html"> 로그인 </a></p>
        </div>
      </form>
    </div>
  </body>
</html>
