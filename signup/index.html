<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓 - 회원가입</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-PBSBSM53"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
  </head>
  <body>
    <main class="auth-container">
      <a href="/" class="auth=logo">
        <img src="../images/logo.png" alt="판다마켓" />
      </a>
      <form action="" class="auth-form">
        <div class="input-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div class="input-group">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">비밀번호</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <img src="/images/Vector.png" alt="" class="password-icon" />
          </div>
        </div>

        <div class="input-group">
          <label for="password-confirm">비밀번호 확인</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password-confirm"
              name="password-confirm"
              placeholder="비밀번호를 다시 입력해주세요"
              required
            />
            <img src="/images/Vector.png" alt="" class="password-icon" />
          </div>
        </div>

        <button type="submit" class="auth-button">회원가입</button>
      </form>
      <div class="social-login">
        <span>간편 로그인하기</span>

        <div class="social-link">
          <a href="https://www.google.com">
            <img src="/images/Component 2.png" alt="구글" />
          </a>

          <a href="https://www.kakao.com">
            <img src="/images/Component 3.png" alt="카카오" />
          </a>
        </div>
      </div>
      <p class="auth-bottom">
        이미 회원이신가요?
        <a href="/login/index.html">로그인</a>
      </p>
    </main>
  </body>
</html>
