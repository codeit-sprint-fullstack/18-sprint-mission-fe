<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 판다마켓</title>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZMYKHP6EME"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-ZMYKHP6EME");
    </script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/palette.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth">
      <a href="/" class="auth-logo">
        <img src="../images/logo_auth.svg" alt="판다마켓 홈으로" />
      </a>

      <form class="auth-form">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="이메일을 입력해주세요" />
        </div>

        <div class="field">
          <label for="nickname">닉네임</label>
          <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="닉네임을 입력해주세요" />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="비밀번호를 입력해주세요" />
            <button type="button" class="btn-visibility" aria-label="비밀번호 보기">
              <img src="../images/ic_visibility_off.svg" alt="" width="24" height="24" />
            </button>
          </div>
        </div>

        <div class="field">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="input-wrap">
            <input
              id="password-confirm"
              name="passwordConfirm"
              type="password"
              autocomplete="new-password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
            <button type="button" class="btn-visibility" aria-label="비밀번호 보기">
              <img src="../images/ic_visibility_off.svg" alt="" width="24" height="24" />
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" disabled>회원가입</button>

        <div class="easy-login">
          <p>간편 로그인하기</p>
          <div class="easy-login-links">
            <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
              <img src="../images/ic_google.png" alt="구글로 로그인" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
              <img src="../images/ic_kakao.svg" alt="카카오로 로그인" />
            </a>
          </div>
        </div>

        <p class="auth-switch">
          이미 회원이신가요?
          <a href="/login">로그인</a>
        </p>
      </form>
    </main>

    <script src="../js/password-toggle.js"></script>
  </body>
</html>
