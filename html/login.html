<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/font.css" />
    <link rel="stylesheet" href="../css/logsign.css" />
    <title>로그인</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">
          <a href="/"><img src="../image/logo-l.svg" alt="판다마켓" /></a>
        </div>
      </header>
      <main>
        <section class="login-wrap">
          <div class="login-item email">
            <h3>이메일</h3>
            <input type="email" placeholder="이메일을 입력해주세요" />
          </div>
          <div class="login-item pw">
            <h3>비밀번호</h3>
            <div class="pw-wrap">
              <input type="password" placeholder="비밀번호를 입력해주세요" />
              <a href="#"
                ><img src="../image/log-eye.svg" alt="비밀번호 표시"
              /></a>
            </div>
          </div>
          <div class="login-item login-btn">
            <a href="#">로그인</a>
          </div>
          <div class="login-item sns-login">
            <span>간편 로그인 하기</span>
            <div class="sns-wrap">
              <div class="sns google">
                <a href="https://www.google.com/"
                  ><img src="../image/sns-g.svg" alt="google"
                /></a>
              </div>
              <div class="sns kakao">
                <a href="https://www.kakaocorp.com/page/"
                  ><img src="../image/sns-k.svg" alt="kakao"
                /></a>
              </div>
            </div>
          </div>
          <div class="login-item login-b">
            <span>판다마켓이 처음이신가요?</span>
            <a href="../html/signup.html">회원가입</a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
