<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <a href="/" class="logo-link">
            <img src="/images/logo.png" alt="판다마켓 로고" />
          </a>
        </div>
        <nav class="nav">
          <a href="/login" class="login-btn">로그인</a>
        </nav>
      </div>
    </header>
    <main class="main">
      <section class="container">
        <div class="temp" style="height: 100vh">Privacy Policy</div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p class="copyright">&copy;codeit - 2024</p>
        <nav class="bottom-nav">
          <a href="/privacy" class="privacy-policy">Privacy Policy</a>
          <a href="/faq" class="faq">FAQ</a>
        </nav>
        <nav class="sns-nav">
          <a
            href="https://www.facebook.com"
            class="sns-facebook"
            target="_blank"
          >
            <img src="/images/sns_icons/ic_facebook.png" alt="facebook" />
          </a>
          <a href="https://www.x.com" class="sns-twitter" target="_blank">
            <img src="/images/sns_icons/ic_twitter.png" alt="twitter" />
          </a>
          <a href="https://www.youtube.com" class="sns-youtube" target="_blank">
            <img src="/images/sns_icons/ic_youtube.png" alt="youtube" />
          </a>
          <a
            href="https://www.instagram.com"
            class="sns-instagram"
            target="_blank"
          >
            <img src="/images/sns_icons/ic_instagram.png" alt="instagram" />
          </a>
        </nav>
      </div>
    </footer>
  </body>
</html>
